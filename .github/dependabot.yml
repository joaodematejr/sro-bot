version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch e minor num PR so por semana; major vem em PR proprio.
      menores:
        update-types: [minor, patch]
    ignore:
      # Os tipos acompanham o Node do Electron (Electron 45 = Node 24); ao subir
      # o Electron, subir o @types/node a mao. Tipo de Node mais novo deixaria o
      # tsc aceitar API que nao existe no app.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "app"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
