name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Os testes sao da logica pura: nao precisam do binario do Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # O build completo pega o que os testes nao pegam (o CSS do Tailwind 4 nao
      # compilava e os testes passavam).
      - name: Build do app (main, renderer e CSS)
        run: |
          npm run build
          grep -q "#0b0d10" dist/styles.css || { echo "::error::dist/styles.css sem a cor do tema"; exit 1; }

  guard:
    name: Guarda de conteudo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/guard.sh

  engine:
    uses: ./.github/workflows/engine.yml
