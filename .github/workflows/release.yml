name: Release

# Tag v* (ex.: v0.140.0): compila o engine, gera o EXE portatil com ele dentro
# e publica um Release com o EXE, o LEIA-ME e as notas da versao no CHANGELOG.
# Rodado a mao (Actions > Release > Run workflow): so gera o EXE como artefato,
# sem publicar nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  exe:
    name: EXE portatil
    needs: engine
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: engine-build
          path: engine/build
      - name: Versao pela tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Conferir o engine no pacote
        run: |
          ls -la release
          test -f release/win-unpacked/resources/engine/build/libsroengine.so
          test -f release/win-unpacked/resources/engine/build/libsroloader.so
      - uses: actions/upload-artifact@v7
        with:
          name: sro-bot-windows
          path: |
            app/release/*.exe
            app/release/LEIA-ME.md
          if-no-files-found: error
      - name: Publicar o Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' ../CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versao $v." > notas.md
          gh release create "$GITHUB_REF_NAME" release/*.exe release/LEIA-ME.md \
            --title "SRO Bot $v" --notes-file notas.md
